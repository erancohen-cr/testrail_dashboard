name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build # includes TypeScript check

  image:
    # Build the Docker image on every push to main and keep it as a downloadable artifact.
    # ponytail: no registry/deploy yet; the target server can't reach github.com. Add a deploy job once the network path exists.
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t testrail-dashboard:${{ github.sha }} .
      - run: docker save testrail-dashboard:${{ github.sha }} | gzip > testrail-dashboard.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: testrail-dashboard-image
          path: testrail-dashboard.tar.gz
          retention-days: 14
